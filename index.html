function loadSrc(src,info){
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    if(img.width!==64||(img.height!==64&&img.height!==32)){msg('Нужен скин 64×64 или 64×32, а этот '+img.width+'×'+img.height+'.','err');return;}
    skinImg=img;skinX.clearRect(0,0,64,64);skinX.drawImage(img,0,0);
    $('skininfo').textContent=info||(img.width+'×'+img.height);
    msg('',''); render();

  img.onerror=()=>msg('Не удалось загрузить картинку. Если это ссылка textures.minecraft.net, браузер мог заблокировать её (CORS) — скачайте PNG и загрузите файлом.','err');
  img.src=src;
}

function parseInput(s){
  s=s.trim().replace(/^"|"$/g,'');
  if(!s) return null;
  if(/^data:image\//.test(s)) return {src:s,info:'Из data:URL'};
  if(/^https?:\/\//.test(s)) return {src:s.replace(/^http:/,'https:'),info:'По ссылке'};
  const clean=s.replace(/\s+/g,'');
  if(clean.startsWith('iVBOR')) return {src:'data:image/png;base64,'+clean,info:'PNG из base64'};
  let txt;
  try{txt=atob(clean.replace(/-/g,'+').replace(/_/g,'/'));}catch(e){throw new Error('Это не base64.');}
  if(txt.startsWith('\x89PNG')) return {src:'data:image/png;base64,'+clean,info:'PNG из base64'};
  let j;try{j=JSON.parse(txt);}catch(e){throw new Error('base64 раскодирован, но внутри не PNG и не JSON.');}
  const url=j&&j.textures&&j.textures.SKIN&&j.textures.SKIN.url;
  if(!url) throw new Error('В JSON нет textures.SKIN.url.');
  return {src:url.replace(/^http:/,'https:'),info:(j.profileName?j.profileName+' — ':'')+'из свойства textures'};
}

// ---- рендер ----
// Ракурс GUI из template_skull.json: rotation [30, 45, 0]. Лицо справа, боковая грань (right в UV, x=0..8) — слева, как в игре и на minecraft-heads.com.
const A=-45*Math.PI/180,B=30*Math.PI/180;
function proj(x,y,z){const x1=x*Math.cos(A)-z*Math.sin(A),z1=x*Math.sin(A)+z*Math.cos(A);return [x1,-(y*Math.cos(B)-z1*Math.sin(B))];}
const SHADE={top:1,front:0.92,side:0.72};
function faces(h){return [
  {n:'top',  u:8, v:0, p:[[-h,h,-h],[h,h,-h],[-h,h,h]]},
  {n:'front',u:8, v:8, p:[[-h,h,h],[h,h,h],[-h,-h,h]]},
  {n:'side', u:0, v:8, p:[[-h,h,-h],[-h,h,h],[-h,-h,-h]]}
];}
const tile=document.createElement('canvas');tile.width=tile.height=8;const tx=tile.getContext('2d',{willReadFrequently:true});
function faceTile(ox,oy,k){
  tx.clearRect(0,0,8,8);tx.drawImage(skinImg,ox,oy,8,8,0,0,8,8);
  if(k<1){const d=tx.getImageData(0,0,8,8);for(let i=0;i<d.data.length;i+=4){d.data[i]*=k;d.data[i+1]*=k;d.data[i+2]*=k;}tx.putImageData(d,0,0);}
  return tile;
}
function draw(ctx,S,hat,shade){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,S,S);ctx.imageSmoothingEnabled=false;
  if(!skinImg) return;
  const ext=(Math.abs(Math.cos(A))+Math.abs(Math.sin(A)))*1.125; // всегда с запасом под второй слой, чтобы голова не меняла размер // ширина проекции при h=1 = 2*ext
  const sc=S*0.5/ext*0.96, cx=S/2, cy=S/2;
  const layers=[{h:1,du:0}];if(hat)layers.push({h:1.125,du:32});
  for(const L of layers){
    for(const f of faces(L.h)){
      const [p0,p1,p3]=f.p.map(p=>proj(...p)).map(([x,y])=>[cx+x*sc,cy+y*sc]);
      const t=faceTile(f.u+L.du,f.v,1-(1-SHADE[f.n])*(+shade));
      const e=L.du?0:0.04; // чуть перекрываем грани, чтобы не было щелей
      ctx.setTransform((p1[0]-p0[0])/8,(p1[1]-p0[1])/8,(p3[0]-p0[0])/8,(p3[1]-p0[1])/8,p0[0],p0[1]);
      ctx.drawImage(t,0,0,8,8,-e,-e,8+2*e,8+2*e);
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
}
function opts(){return [$('hat').checked,$('shade').checked];}
function render(){
  const [hat,shade]=opts();
  draw($('out').getContext('2d'),256,hat,shade);
  const box=$('sizes');box.innerHTML='';
  for(const s of [16,32,48,64]){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s,hat,shade);const f=document.createElement('figure');f.appendChild(c);f.append(s+'px');box.appendChild(f);}
}

(()=>{
  // смена скина: пиксели перекрашиваются по очереди
  const o=$('out'),big=o.parentNode,W=256,C=4,N=W/C;
  const fx=document.createElement('canvas');fx.width=fx.height=W;fx.className='fx';fx.setAttribute('aria-hidden','true');big.appendChild(fx);
  const fc=fx.getContext('2d');
  const snap=document.createElement('canvas');snap.width=snap.height=W;const sc=snap.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)');
  let lastSkin=null,lastPrev=null,raf=0,fin=0;
  const stop=()=>{cancelAnimationFrame(raf);clearTimeout(fin);fc.clearRect(0,0,W,W);o.style.opacity='';};
  const r0=render;
  render=function(){
    const changed=lastSkin&&skinImg&&skinImg!==lastSkin;
    if(changed){sc.clearRect(0,0,W,W);sc.drawImage(o,0,0,W,W);}
    stop();r0();lastPrev=lastSkin;lastSkin=skinImg;
    if(!window.__quiet){o.classList.remove('pop');void o.offsetWidth;}
    if(!changed||still.matches){if(!window.__quiet)o.classList.add('pop');return;}
    const A=sc.getImageData(0,0,W,W).data,Bd=o.getContext('2d').getImageData(0,0,W,W).data;
    // карта «какой пиксель скина где на экране»: рисуем голову скином, где цвет = координаты
    const oldSkin=lastPrev,newSkin=skinImg,hat=$('hat').checked;
    const al=c=>{const t=document.createElement('canvas');t.width=t.height=64;const x=t.getContext('2d');if(c)x.drawImage(c,0,0);return x.getImageData(0,0,64,64).data;};
    const ao=al(oldSkin),an=al(newSkin);
    const ids=document.createElement('canvas');ids.width=ids.height=64;const ix=ids.getContext('2d');const id=ix.createImageData(64,64);
    for(let v=0;v<64;v++)for(let u=0;u<64;u++){const k=(v*64+u)*4;const over=u>=32&&v<16;
      id.data[k]=u*4+2;id.data[k+1]=v*4+2;id.data[k+2]=200;id.data[k+3]=over?((ao[k+3]||an[k+3])?255:0):255;}
    ix.putImageData(id,0,0);
    const mc=document.createElement('canvas');mc.width=mc.height=W;const mx=mc.getContext('2d');
    skinImg=ids;draw(mx,W,hat,false);skinImg=newSkin;
    const M=mx.getImageData(0,0,W,W).data;
    const tex=new Int16Array(W*W).fill(-1),sum=new Float32Array(4096),cnt=new Float32Array(4096);
    for(let p=0;p<W*W;p++){const k=p*4;if(M[k+3]>250&&Math.abs(M[k+2]-200)<6){const t=(M[k+1]>>2)*64+(M[k]>>2);tex[p]=t;sum[t]+=(p%W)+(p/W|0);cnt[t]++;}}
    // у каждого пикселя скина своё время: волна сверху-слева + случайность
    const when=new Float32Array(4096);
    for(let t=0;t<4096;t++)when[t]=cnt[t]?(sum[t]/cnt[t])/(2*W)*0.45+Math.random()*0.4:0;
    const out=fc.createImageData(W,W),D=out.data,F=0.15;
    o.style.opacity='0';
    const T=1100,t0=performance.now();
    const step=now=>{
      const t=Math.min(1,(now-t0)/T);
      for(let p=0;p<W*W;p++){
        const k=p*4,tt=tex[p];
        let q=tt<0?t:(t-when[tt])/F;q=q<0?0:q>1?1:q;
        const r=1-q;
        D[k]=A[k]*r+Bd[k]*q;D[k+1]=A[k+1]*r+Bd[k+1]*q;D[k+2]=A[k+2]*r+Bd[k+2]*q;D[k+3]=A[k+3]*r+Bd[k+3]*q;
      }
      fc.putImageData(out,0,0);
      if(t<1)raf=requestAnimationFrame(step);else stop();
    };
    raf=requestAnimationFrame(step);
    fin=setTimeout(stop,T+400);
  };
})();

(()=>{

  opts=function(){const r=baseOpts();r[1]=mix;return r;};
  cb.onchange=()=>{

    if(matchMedia('(prefers-reduced-motion: reduce)').matches){mix=to;window.__quiet=true;render();window.__quiet=false;return;}
    const step=now=>{
      const p=Math.min(1,(now-t0)/T),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      mix=from+(to-from)*e;
      window.__quiet=true;render();window.__quiet=false;
      if(p<1)sraf=requestAnimationFrame(step);
    };
    sraf=requestAnimationFrame(step);
    setTimeout(()=>{if(mix!==to){cancelAnimationFrame(sraf);mix=to;window.__quiet=true;render();window.__quiet=false;}},T+300);
  };
})();
// самолётик: улетает от кнопки в правый верхний угол (там в Chrome загрузки), потом скачивание
(()=>{
  const btn=$('dl'),save=btn.onclick;let busy=false,side=Math.random()<.5?1:-1;
  const svg='<svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><path d="M1 1 29 12 1 23 7 12Z" fill="#e6e0d3" stroke="#1b1a17" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 12H29" stroke="#9a9384" stroke-width="1.5"/><path d="M7 12 1 23 12 14Z" fill="#b9b1a2"/></svg>';
  btn.onclick=()=>{
    if(busy)return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){(window.__saveHook||save)();return;}
    busy=true;
    const r=btn.getBoundingClientRect();
    const x0=r.left+r.width/2,y0=r.top+r.height/2;
    const x2=innerWidth-30-Math.random()*16,y2=16+Math.random()*12; // куда летим
    // каждый раз новая траектория: сначала ныряет вниз, потом уходит вправо и наверх
    const R=(a,b)=>a+Math.random()*(b-a),H=innerHeight,Wd=innerWidth;
    side=-side; // чередуем сторону нырка, чтобы два раза подряд не было похоже
    const cx1=Math.max(20,Math.min(Wd-20,x0+side*R(60,260))),cy1=Math.min(H-10,y0+R(120,320));
    const cx2=Math.max(20,Math.min(Wd-20,x2-R(-40,260))),cy2=Math.min(H-10,Math.max(y0,H*R(.55,.95)));
    const wob=R(0,18),wf=R(1.5,4),wp=R(0,6.28); // немного виляния в полёте
    const spin=Math.random()<.3?(Math.random()<.5?-1:1)*6.28:0; // иногда делает бочку
    const pl=document.createElement('div');pl.className='plane';pl.innerHTML=svg;document.body.appendChild(pl);
    btn.classList.add('sent');
    const T=1800,t0=performance.now();let lastTrail=0,done=false,raf=0;
    const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);pl.remove();
      const l=document.createElement('div');l.className='landing';document.body.appendChild(l);setTimeout(()=>l.remove(),600);
      (window.__saveHook||save)();setTimeout(()=>{busy=false;},300);};
    const step=now=>{
      const p=Math.min(1,(now-t0)/T),t=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // разгон и торможение
      const u=1-t;
      let x=u*u*u*x0+3*u*u*t*cx1+3*u*t*t*cx2+t*t*t*x2,y=u*u*u*y0+3*u*u*t*cy1+3*u*t*t*cy2+t*t*t*y2;
      const dx=3*u*u*(cx1-x0)+6*u*t*(cx2-cx1)+3*t*t*(x2-cx2),dy=3*u*u*(cy1-y0)+6*u*t*(cy2-cy1)+3*t*t*(y2-cy2);
      const len=Math.hypot(dx,dy)||1,w=wob*Math.sin(t*wf*6.28+wp)*Math.sin(t*3.14);
      x+=-dy/len*w;y+=dx/len*w;
      const roll=spin*Math.max(0,Math.min(1,(t-.35)/.3));
      const a=Math.atan2(dy,dx)+roll,sc=1.3-0.75*t,op=p>.85?(1-p)/.15:1;
      pl.style.transform='translate('+x+'px,'+y+'px) rotate('+a+'rad) scale('+sc+')';pl.style.opacity=op;
      if(now-lastTrail>35&&p<.9){lastTrail=now;const d=document.createElement('i');d.className='trail';d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),950);}
      if(p<1)raf=requestAnimationFrame(step);else finish();
    };
    raf=requestAnimationFrame(step);
    setTimeout(finish,T+400); // если кадры не идут — всё равно скачать
  };
})();
// подпись: шрифт из игры + шейдер + случайные ч/б глюки + частицы
(()=>{
  const TEXT='TgGeyserMc',PAD=5,M=90,cv=$('sig'),fx=$('sigfx'),fc2=fx.getContext('2d');
  const R=(a,b)=>a+Math.random()*(b-a),still=matchMedia('(prefers-reduced-motion: reduce)');
  const im=new Image();
  im.onload=()=>{
    const fc=document.createElement('canvas');fc.width=fc.height=128;const fx0=fc.getContext('2d');fx0.drawImage(im,0,0);
    const F=fx0.getImageData(0,0,128,128).data,on=(x,y)=>F[(y*128+x)*4+3]>0;
    const gw=c=>{let w=0;for(let x=0;x<8;x++)for(let y=0;y<8;y++)if(on((c%16)*8+x,(c>>4)*8+y))w=x+1;return c===32?4:w;};
    let tw=0;for(const ch of TEXT)tw+=gw(ch.charCodeAt(0))+1;tw-=1;
    const W=tw+1+PAD*2,H=9+PAD*2;
    const avail=(document.querySelector('.wrap')||document.body).clientWidth-28;
    const SC=Math.max(2,Math.min(6,Math.floor(avail/W)));
    const tc=document.createElement('canvas');tc.width=W;tc.height=H;const tx=tc.getContext('2d'),id=tx.createImageData(W,H),D=id.data;
    const put=(x,y,v)=>{const i=(y*W+x)*4;D[i]=D[i+1]=D[i+2]=v;D[i+3]=255;};
    const pix=[],letters=[];
    for(const pass of [0,1]){let cx=PAD,li=0;for(const ch of TEXT){const c=ch.charCodeAt(0),w=gw(c);
      if(pass)letters.push({x0:cx,x1:cx+w+1});
      for(let x=0;x<w;x++)for(let y=0;y<8;y++)if(on((c%16)*8+x,(c>>4)*8+y)){put(cx+x+(pass?0:1),PAD+y+(pass?0:1),pass?255:63);if(pass)pix.push({x:cx+x,y:PAD+y,l:li});}
      cx+=w+1;li++;}}
    tx.putImageData(id,0,0);
    cv.width=W*SC;cv.height=H*SC;cv.style.width=W*SC+'px';
    fx.width=W*SC+2*M;fx.height=H*SC+2*M;fx.style.left=fx.style.top=-M+'px';

    // ---------- шейдер ----------
    const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
    let draw=()=>{},U={};
    if(!gl){const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(tc,0,0,W*SC,H*SC);}
    else{
      const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o;};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0,1);}'));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float;
uniform sampler2D t;uniform vec2 S;uniform float T,G,SEED,AMT;uniform vec2 HID;varying vec2 v;
float h(float n){return fract(sin(n*12.9898+SEED*.731)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+SEED)*43758.5453);}
vec4 tx(vec2 p){if(p.x>=HID.x&&p.x<HID.y)return vec4(0.);return texture2D(t,p/S);}
void main(){
  vec2 P=v*S;

// ---------- Telegram Mini App ----------
(()=>{
  const tg=window.Telegram&&Telegram.WebApp;
  if(!tg||!tg.platform||tg.platform==='unknown')return; // открыто не в Телеграме — обычный сайт
  const v=x=>tg.isVersionAtLeast&&tg.isVersionAtLeast(x);
  document.documentElement.classList.add('tg');
  try{tg.ready();tg.expand();}catch(e){}
  try{if(v('6.1')){tg.setHeaderColor('#101115');tg.setBackgroundColor('#101115');}}catch(e){}
  try{if(v('7.10'))tg.setBottomBarColor('#101115');}catch(e){}
  const hf=v('6.1')&&tg.HapticFeedback;
  const tap=s=>{try{hf&&hf.impactOccurred(s||'light');}catch(e){}};
  const sel=()=>{try{hf&&hf.selectionChanged();}catch(e){}};
  const note=t=>{try{hf&&hf.notificationOccurred(t);}catch(e){}};
  document.addEventListener('click',e=>{if(e.target.closest('button,#dd-btn'))tap();},true);
  document.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]'))sel();},true);
  $('dd-list').addEventListener('click',sel,true);
  // скачивание: внутри Телеграма обычная загрузка файла не работает -> показываем карточку
  let sheet=null;
  const close=()=>{if(!sheet)return;const s=sheet;sheet=null;s.classList.remove('on');setTimeout(()=>s.remove(),320);try{tg.BackButton.hide();tg.BackButton.offClick(close);}catch(e){}};
  window.__saveHook=()=>{
    note('success');
    const url=exportURL(),name='head_'+$('size').value+'.png';
    sheet=document.createElement('div');sheet.className='tgsheet';
    sheet.innerHTML='<div class="card"><img alt="иконка"><p>зажми картинку → «сохранить»</p><div class="row"><button class="p" data-a="share">поделиться</button><button data-a="close">закрыть</button></div></div>';
    sheet.querySelector('img').src=url;
    const shareBtn=sheet.querySelector('[data-a=share]');
    let file=null;
    fetch(url).then(r=>r.blob()).then(b=>{file=new File([b],name,{type:'image/png'});if(!(navigator.canShare&&navigator.canShare({files:[file]})))shareBtn.remove();}).catch(()=>shareBtn.remove());
    sheet.addEventListener('click',async e=>{
      if(e.target===sheet||e.target.dataset.a==='close'){close();return;}
      if(e.target.dataset.a==='share'&&file){try{await navigator.share({files:[file]});}catch(err){}}
    });
    document.body.appendChild(sheet);requestAnimationFrame(()=>requestAnimationFrame(()=>sheet&&sheet.classList.add('on')));
    try{if(v('6.1')){tg.BackButton.onClick(close);tg.BackButton.show();}}catch(e){}
  };
})();

// свой выпадающий список размера
(()=>{
  const dd=$('dd'),btn=$('dd-btn'),list=$('dd-list'),inp=$('size');
  const items=[...list.querySelectorAll('li')];let act=-1;
  const setAct=i=>{act=(i+items.length)%items.length;items.forEach((li,j)=>li.classList.toggle('act',j===act));};
  const open=()=>{dd.classList.add('open');btn.setAttribute('aria-expanded','true');setAct(items.findIndex(li=>li.dataset.v===inp.value));list.focus();};
  const close=(focus)=>{dd.classList.remove('open');btn.setAttribute('aria-expanded','false');if(focus)btn.focus();};
  const pick=i=>{const li=items[i];inp.value=li.dataset.v;const sp=btn.firstElementChild;if(sp.textContent!==li.dataset.v+' px'){sp.textContent=li.dataset.v+' px';sp.classList.remove('swap');void sp.offsetWidth;sp.classList.add('swap');}items.forEach(x=>x.setAttribute('aria-selected',x===li?'true':'false'));close(true);};
  btn.addEventListener('click',()=>dd.classList.contains('open')?close(true):open());
  btn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open();}});
  items.forEach((li,i)=>{li.addEventListener('click',()=>pick(i));li.addEventListener('mousemove',()=>setAct(i));});
  list.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setAct(act+1);}
    else if(e.key==='ArrowUp'){e.preventDefault();setAct(act-1);}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(act);}
    else if(e.key==='Escape'||e.key==='Tab'){close(e.key==='Escape');}
  });
  document.addEventListener('click',e=>{if(!dd.contains(e.target))close(false);});
})();
