<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Skin Texture — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#191919; --surface:#202020; --raised:#383836;
    --text:#fff; --muted:rgba(255,255,255,.65); --border:rgba(255,255,255,.20);
    --accent:#5E9FE8; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto; -webkit-font-smoothing:antialiased;
  }
  header{margin:8px 0 20px}
  h1{font:600 26px/1.2 inherit;margin:0 0 6px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
  textarea{
    width:100%;min-height:104px;resize:vertical;background:#141414;color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:12px;
    font:13px/1.45 Menlo,Consolas,monospace;word-break:break-all;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{
    flex:1 1 auto;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);
    background:var(--raised);color:var(--text);font:500 15px/1 inherit;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s ease;
  }
  button:hover{opacity:.85}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:transparent;color:#0f1a26;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .msg{display:none;margin-top:12px;padding:12px;border-radius:8px;font-size:14px}
  .msg.err{display:block;background:rgba(233,115,102,.12);border:1px solid rgba(233,115,102,.4);color:#ffc9c2}
  .msg.info{display:block;background:rgba(94,159,232,.12);border:1px solid rgba(94,159,232,.35);color:#cfe3fb}
  #result{display:none}
  .stage{
    display:flex;align-items:flex-end;justify-content:center;gap:36px;
    background:radial-gradient(120% 90% at 50% 0%,#2a3050 0%,#14161e 70%);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 16px;margin-bottom:16px;min-height:220px;
  }
  .stage figure{margin:0;text-align:center}
  .stage canvas{image-rendering:pixelated;display:block;height:180px;width:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
  .stage figcaption{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .meta .chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);flex:1 1 120px}
  .meta .chip b{display:block;color:var(--text);font-size:15px;font-weight:600;margin-top:2px}
  .files{display:flex;gap:16px;align-items:center}
  .files canvas{image-rendering:pixelated;width:72px;height:72px;border:1px solid var(--border);border-radius:8px;background:#141414}
  .files .grow{flex:1}
  .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
  a.dl{display:none}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  code{background:#141414;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>🎮 Skin Texture</h1>
  <p>Вставь base64 — получишь текстуру скина и рендер.</p>
</header>

<section class="card">
  <label for="input">base64 · value из профиля · PNG · ссылка</label>
  <textarea id="input" spellcheck="false" placeholder="ewogICJ0aW1lc3RhbXAiIDog…"></textarea>
  <div class="row">
    <button id="paste">📋 Вставить</button>
    <button id="clear">✕ Очистить</button>
    <button id="go" class="primary">✨ Показать скин</button>
  </div>
  <div id="msg" class="msg"></div>
</section>

<section id="result">
  <div class="stage">
    <figure><canvas id="front" width="16" height="32"></canvas><figcaption>спереди</figcaption></figure>
    <figure><canvas id="back" width="16" height="32"></canvas><figcaption>сзади</figcaption></figure>
  </div>

  <div class="meta">
    <div class="chip">Размер<b id="m-size">—</b></div>
    <div class="chip">Модель<b id="m-model">—</b></div>
    <div class="chip">Источник<b id="m-src">—</b></div>
  </div>

  <div class="card files">
    <canvas id="head" width="8" height="8" aria-label="Аватарка"></canvas>
    <div class="grow">
      <b id="m-name">Текстура готова</b>
      <p class="hint">Оригинальный PNG без сжатия</p>
    </div>
  </div>

  <div class="row">
    <button id="download" class="primary">⬇️ Скачать skin.png</button>
    <button id="send">📨 Отправить в чат</button>
  </div>
  <a id="dl" class="dl" download="skin.png"></a>
</section>

<footer>Поддержка 64×64, старых 64×32 и HD-скинов · <code>slim</code> / <code>classic</code></footer>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const $ = (id) => document.getElementById(id);
const msg = $('msg');
let skinCanvas = null, skinName = 'skin.png';

function show(text, kind){ msg.className = 'msg ' + (kind || 'err'); msg.textContent = text; }
function hideMsg(){ msg.className = 'msg'; msg.textContent = ''; }
function haptic(type){ try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch(e){} }

function cleanB64(s){
  return s.trim().replace(/^data:image\/\w+;base64,/i, '').replace(/\s+/g, '');
}
function b64ToBytes(s){
  s = cleanB64(s).replace(/-/g,'+').replace(/_/g,'/');
  s += '='.repeat((4 - s.length % 4) % 4);
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
const isPng = (b) => b.length > 8 && b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47;

const PROXIES = [
  (u) => u,
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
];

function blobToImage(blob){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('Битый PNG'));
    img.src = URL.createObjectURL(blob);
  });
}
async function loadImageFromUrl(url){
  let lastErr;
  for (const wrap of PROXIES){
    try {
      const r = await fetch(wrap(url), { mode:'cors' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await blobToImage(await r.blob());
    } catch (e){ lastErr = e; }
  }
  throw new Error('Не удалось загрузить текстуру (' + ((lastErr && lastErr.message) || 'CORS') + ')');
}
function bytesToImage(bytes){ return blobToImage(new Blob([bytes], { type:'image/png' })); }

function normalize(img){
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (w === h && w % 64 === 0){ c.width = w; c.height = h; ctx.drawImage(img,0,0); return c; }
  if (w === 64 && h === 32){
    c.width = 64; c.height = 64;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img,0,0);
    const mirror = (sx,sy,sw,sh,dx,dy) => {
      ctx.save(); ctx.translate(dx + sw, dy); ctx.scale(-1,1);
      ctx.drawImage(img, sx,sy,sw,sh, 0,0,sw,sh); ctx.restore();
    };
    mirror(0,16,16,16,16,48);
    mirror(40,16,16,16,32,48);
    return c;
  }
  throw new Error('Неподдерживаемый размер текстуры: ' + w + '×' + h);
}

const FRONT = {
  base:[[8,8,8,8,4,0],[20,20,8,12,4,8],[44,20,4,12,0,8],[36,52,4,12,12,8],[4,20,4,12,4,20],[20,52,4,12,8,20]],
  over:[[40,8,8,8,4,0],[20,36,8,12,4,8],[44,36,4,12,0,8],[52,52,4,12,12,8],[4,36,4,12,4,20],[4,52,4,12,8,20]],
};
const BACK = {
  base:[[24,8,8,8,4,0],[32,20,8,12,4,8],[52,20,4,12,0,8],[44,52,4,12,12,8],[12,20,4,12,4,20],[28,52,4,12,8,20]],
  over:[[56,8,8,8,4,0],[32,36,8,12,4,8],[52,36,4,12,0,8],[60,52,4,12,12,8],[12,36,4,12,4,20],[12,52,4,12,8,20]],
};

function drawBody(canvas, skin, parts){
  const k = skin.width / 64;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const set of [parts.base, parts.over])
    for (const p of set)
      ctx.drawImage(skin, p[0]*k, p[1]*k, p[2]*k, p[3]*k, p[4], p[5], p[2], p[3]);
}
function drawHead(canvas, skin){
  const k = skin.width / 64;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,8,8);
  ctx.drawImage(skin, 8*k, 8*k, 8*k, 8*k, 0,0,8,8);
  ctx.drawImage(skin, 40*k, 8*k, 8*k, 8*k, 0,0,8,8);
}

async function run(){
  const raw = $('input').value.trim();
  if (!raw){ show('Сначала вставь base64 или ссылку.'); return; }

  $('go').disabled = true;
  show('⏳ Обрабатываю…', 'info');

  try {
    let img, source = 'PNG base64', model = 'classic', name = '';

    if (/^https?:\/\//i.test(raw)){
      img = await loadImageFromUrl(raw);
      source = 'ссылка';
    } else {
      const bytes = b64ToBytes(raw);
      if (isPng(bytes)){
        img = await bytesToImage(bytes);
      } else {
        let json;
        try { json = JSON.parse(new TextDecoder().decode(bytes)); }
        catch(e){ throw new Error('base64 раскодировался, но внутри не PNG и не JSON с текстурами. Возможно, строка обрезана.'); }
        const skin = json && json.textures ? json.textures.SKIN : null;
        if (!skin || !skin.url) throw new Error('В JSON нет textures.SKIN.url — проверь строку value.');
        model = skin.metadata && skin.metadata.model === 'slim' ? 'slim' : 'classic';
        name = json.profileName || '';
        img = await loadImageFromUrl(skin.url);
        source = 'value Mojang';
      }
    }

    skinCanvas = normalize(img);
    skinName = (name ? name.replace(/[^\w.-]/g,'_') : 'skin') + '.png';

    drawBody($('front'), skinCanvas, FRONT);
    drawBody($('back'), skinCanvas, BACK);
    drawHead($('head'), skinCanvas);

    $('m-size').textContent = skinCanvas.width + '×' + skinCanvas.height;
    $('m-model').textContent = model;
    $('m-src').textContent = source;
    $('m-name').textContent = name ? '🏷 ' + name : 'Текстура готова';
    $('result').style.display = 'block';
    hideMsg();
    haptic('success');
    if (tg && tg.MainButton){ tg.MainButton.setText('⬇️ Скачать skin.png'); tg.MainButton.show(); }
  } catch (e){
    $('result').style.display = 'none';
    show('❌ ' + e.message);
    haptic('error');
  } finally {
    $('go').disabled = false;
  }
}

function download(){
  if (!skinCanvas) return;
  skinCanvas.toBlob((blob) => {
    const a = $('dl');
    a.href = URL.createObjectURL(blob);
    a.download = skinName;
    a.click();
    haptic('success');
  }, 'image/png');
}

$('go').addEventListener('click', run);
$('clear').addEventListener('click', () => {
  $('input').value=''; $('result').style.display='none'; hideMsg();
  if (tg && tg.MainButton) tg.MainButton.hide();
});
$('paste').addEventListener('click', async () => {
  try { $('input').value = await navigator.clipboard.readText(); hideMsg(); }
  catch(e){ show('Буфер недоступен — вставь вручную (долгое нажатие в поле).', 'info'); }
});
$('download').addEventListener('click', download);
$('send').addEventListener('click', () => {
  if (!tg){ show('Отправка работает только внутри Telegram.', 'info'); return; }
  tg.sendData(JSON.stringify({ action:'skin', payload: $('input').value.trim().slice(0, 3500) }));
});
if (tg && tg.MainButton) tg.MainButton.onClick(download);
</script>
</body>
</html>
